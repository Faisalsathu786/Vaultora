<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vaultora — deposit stablecoins, earn APY, bet on prediction markets" />
    <title>Vaultora — Arc Testnet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  <script>
// Fetch site design from V5 contract and apply
(async function() {
try {
  const RPC = "https://rpc.testnet.arc.network";
  const ADDR = "0xfc3E223210Ac97bE51BD75E3C414A5b6F21FeeE2";
  const ABI = ["function brandDescription() view returns (string)"];
  const r = await fetch(RPC, {
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_call",
      params:[{to:ADDR,data:"0x95d89b41" /* brandDescription selector */},"latest"]})
  });
  const j = await r.json();
  if (j.result) {
    const hex = j.result.slice(2);
    const bytes = [];
    for (let i = 0; i < hex.length; i += 2) bytes.push(parseInt(hex.slice(i,i+2),16));
    // Skip first 64 bytes (offset + length), rest is UTF-8 content
    const txt = String.fromCharCode(...bytes.slice(64)).replace(/[^ -~]/g,"");
    if (txt.startsWith("{")) {
      const d = JSON.parse(txt);
      const root = document.querySelector(":root") || document.documentElement;
      const style = document.createElement("style");
      let css = "";
      if (d.bg) css += "body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;opacity:.4;background:url("+d.bg+") center/cover no-repeat}";
      if (d.primary) css += ":root{--clr:"+d.primary+"}";
      if (d.cardBg) css += ":root{--card-bg:"+d.cardBg+"}";
      if (d.accent) css += ":root{--accent:"+d.accent+"}";
      if (d.theme === "light") css += ":root{--bg:#fff;--fg:#000}";
      if (d.mktImgW) css += ".mkt-img{width:"+d.mktImgW+"px}";
      if (d.mktImgH) css += ".mkt-img{height:"+d.mktImgH+"px}";
      if (css) { style.textContent = css; document.head.appendChild(style); }
    }
  }
} catch(e) { console.log("Site design load:", e.message); }
})();
</script>

</html>
